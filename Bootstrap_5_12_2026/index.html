<!DOCTYPE html>
<html>
  <head>
    <title>3x6 CSS Grid</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      .grid-container {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        grid-template-rows: repeat(3, 80px);
      }
    </style>
  </head>

  <body class="bg-light">
    <div class="container mt-4">
      <h4 class="text-center text-primary mb-3"></h4>

      <div class="grid-container">
        <div
          class="border border-secondary d-flex justify-content-center align-items-center fw-bold bg-white"
        >
          1
        </div>
        <div
          class="border border-secondary d-flex justify-content-center align-items-center fw-bold bg-primary"
        >
          2
        </div>
        <div
          class="border border-secondary d-flex justify-content-center align-items-center fw-bold bg-secondary"
        >
          3
        </div>
        <div
          class="border border-secondary d-flex justify-content-center align-items-center fw-bold bg-success"
        >
          4
        </div>
        <div
          class="border border-secondary d-flex justify-content-center align-items-center fw-bold bg-info"
        >
          5
        </div>
        <div
          class="border border-secondary d-flex justify-content-center align-items-center fw-bold bg-white"
        >
          6
        </div>

        <div
          class="border border-secondary d-flex justify-content-center align-items-center fw-bold bg-white"
        >
          7
        </div>
        <div
          class="border border-secondary d-flex justify-content-center align-items-center fw-bold bg-white"
        >
          8
        </div>
        <div
          class="border border-secondary d-flex justify-content-center align-items-center fw-bold bg-white"
        >
          9
        </div>
        <div
          class="border border-secondary d-flex justify-content-center align-items-center fw-bold bg-white"
        >
          10
        </div>
        <div
          class="border border-secondary d-flex justify-content-center align-items-center fw-bold bg-white"
        >
          11
        </div>
        <div
          class="border border-secondary d-flex justify-content-center align-items-center fw-bold bg-white"
        >
          12
        </div>

        <div
          class="border border-secondary d-flex justify-content-center align-items-center fw-bold bg-light"
        >
          1
        </div>
        <div
          class="border border-secondary d-flex justify-content-center align-items-center fw-bold bg-primary text-white"
        >
          2
        </div>
        <div
          class="border border-secondary d-flex justify-content-center align-items-center fw-bold bg-secondary text-white"
        >
          3
        </div>
        <div
          class="border border-secondary d-flex justify-content-center align-items-center fw-bold bg-success text-white"
        >
          4
        </div>
        <div
          class="border border-secondary d-flex justify-content-center align-items-center fw-bold bg-info text-dark"
        >
          5
        </div>
        <div
          class="border border-secondary d-flex justify-content-center align-items-center fw-bold bg-warning text-dark"
        >
          6
        </div>

        <div
          class="border border-secondary d-flex justify-content-center align-items-center fw-bold bg-danger text-white"
        >
          7
        </div>
        <div
          class="border border-secondary d-flex justify-content-center align-items-center fw-bold bg-dark text-white"
        >
          8
        </div>
        <div
          class="border border-secondary d-flex justify-content-center align-items-center fw-bold bg-primary-subtle"
        >
          9
        </div>
        <div
          class="border border-secondary d-flex justify-content-center align-items-center fw-bold bg-success-subtle"
        >
          10
        </div>
        <div
          class="border border-secondary d-flex justify-content-center align-items-center fw-bold bg-warning-subtle"
        >
          11
        </div>
        <div
          class="border border-secondary d-flex justify-content-center align-items-center fw-bold bg-info-subtle"
        >
          12
        </div>
      </div>
    </div>
  </body>
</html>
