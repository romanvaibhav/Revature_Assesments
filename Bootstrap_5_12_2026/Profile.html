<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Profile</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="row">
        <!-- 1 Column -->
        <div class="col-12">
          <div class="card shadow-sm text-center p-4">
            <!-- Profile Image -->
            <img
              src="https://via.placeholder.com/150"
              class="rounded-circle mx-auto mb-3"
              alt="Profile Picture"
              width="150"
              height="150"
            />

            <!-- Name -->
            <h3 class="card-title">John Doe</h3>

            <!-- Role -->
            <p class="text-muted">Web Developer</p>

            <!-- Bio -->
            <p class="card-text">
              Passionate about building clean and responsive web applications
              using HTML, CSS, and Bootstrap.
            </p>

            <!-- Details -->
            <ul class="list-group list-group-flush mb-3">
              <li class="list-group-item">📍 Location: New York</li>
              <li class="list-group-item">📧 Email: john@example.com</li>
              <li class="list-group-item">📞 Phone: +1 234 567 890</li>
            </ul>

            <!-- Button -->
            <button class="btn btn-primary">Contact Me</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
