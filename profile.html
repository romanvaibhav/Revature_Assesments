<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Page</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f2f5;
        padding: 20px;
      }

      fieldset {
        margin-bottom: 20px;
        padding: 15px 20px;
        border-radius: 10px;
        border: 2px solid #4caf50;
        background-color: #fff;
      }

      legend {
        font-weight: bold;
        color: #4caf50;
        padding: 0 10px;
      }

      .profile-picture {
        display: block;
        margin: 10px 0;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #4caf50;
      }

      .skills span,
      .hobbies span {
        display: inline-block;
        background-color: #e0f7fa;
        padding: 5px 10px;
        margin: 5px;
        border-radius: 5px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <fieldset>
      <legend>Profile Information</legend>
      <img src="./93670918.cms" alt="Profile Picture" class="profile-picture" />
      <p><strong>Name:</strong> Vaibhav Roman</p>
    </fieldset>

    <fieldset>
      <legend>Hobbies</legend>
      <div class="hobbies">
        <span>Hidden</span>
      </div>
    </fieldset>

    <fieldset>
      <legend>Skills</legend>
      <ul>
        <li>Java</li>
      </ul>
      <div class="skills">
        <li>Java</li>
        <span>C++</span>
        <span>HTML</span>
        <span>CSS</span>
        <span>JavaScript</span>
        <span>TypeScript</span>
        <span>React.js</span>
        <span>Angular</span>
        <span>Tailwind</span>
        <span>Bootstrap</span>
        <span>Express.js</span>
        <span>Node.js</span>
        <span>Spring Boot</span>
        <span>Hibernate</span>
        <span>JDBC</span>
        <span>SQL</span>
        <span>MySQL</span>
        <span>PostgreSQL</span>
        <span>MongoDB</span>
        <span>Postman</span>
        <span>Git</span>
        <span>GitHub</span>
        <span>OpenShift</span>
        <span>Docker</span>
        <span>AWS</span>
        <span>Kubernetes</span>
      </div>
    </fieldset>
  </body>
</html>
